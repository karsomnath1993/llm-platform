services:

  api:
    build:
      context: .
    image: llm-platform-api:1.0.0

    ports:
      - "8000:8000"

    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL_NAME: qwen3:0.6b
      REDIS_URL: redis://redis:6379

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3


  ollama:
    image: ollama/ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 30s
      timeout: 10s
      retries: 5


  redis:
    image: redis:7-alpine

    volumes:
      - redis_data:/data


volumes:
  ollama_data:
  redis_data: