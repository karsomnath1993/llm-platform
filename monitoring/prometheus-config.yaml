apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: llm-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'llm-api'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - llm-platform
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: llm-api
          - source_labels: [__address__]
            action: replace
            regex: (.+):\d+
            replacement: $1:8000
            target_label: __address__